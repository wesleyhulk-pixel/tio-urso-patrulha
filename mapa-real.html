<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>TopoExport — visualizador de conferência</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081623;color:#fff;font:14px system-ui}#view{position:absolute;inset:0;touch-action:none}#toolbar{position:fixed;left:8px;right:8px;top:8px;display:flex;flex-wrap:wrap;gap:7px;z-index:3}button{border:1px solid #9bcce5;background:#173d55;color:#fff;border-radius:7px;padding:9px 12px;font-weight:600;touch-action:manipulation}#status{background:#0e2936e8;padding:8px;border-radius:6px}#help{position:fixed;bottom:6px;left:6px;right:6px;background:#0b293de8;padding:7px;pointer-events:none;font-size:12px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script></head><body><div id="view"></div><div id="toolbar"><button id="top">Vista aérea</button><button id="angle">Perspectiva</button><button id="zoomIn">+ Zoom</button><button id="zoomOut">− Zoom</button><button id="left">↶ Girar</button><button id="right">↷ Girar</button><button id="reset">Centralizar</button><span id="status">Carregando...</span></div><div id="help">VISTA AÉREA: arraste com 1 dedo para mover; use + e − para zoom. PERSPECTIVA: 1 dedo gira, 2 dedos aproximam/movem. Este GLB ainda não está georreferenciado com a quadra da Matriz.</div><script type="module">import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';const host=document.getElementById('view'),status=document.getElementById('status');const scene=new THREE.Scene();scene.background=new THREE.Color(0xb8d8e6);const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,10000);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);host.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x9ca9a9,2.2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(200,500,300);scene.add(sun);const c=new OrbitControls(camera,renderer.domElement);c.enableDamping=true;c.enablePan=true;c.screenSpacePanning=true;c.minDistance=4;c.maxDistance=4000;let dim=600,center=new THREE.Vector3(),aerial=true,azimuth=0;function aerialView(reset=true){aerial=true;c.enableRotate=false;c.mouseButtons.LEFT=THREE.MOUSE.PAN;c.touches.ONE=THREE.TOUCH.PAN;c.touches.TWO=THREE.TOUCH.DOLLY_PAN;camera.up.set(0,0,-1);if(reset){azimuth=0;camera.position.set(center.x,center.y+dim*1.4,center.z+.01);c.target.copy(center);}camera.lookAt(c.target);c.update();}function perspective(){aerial=false;c.enableRotate=true;c.mouseButtons.LEFT=THREE.MOUSE.ROTATE;c.touches.ONE=THREE.TOUCH.ROTATE;c.touches.TWO=THREE.TOUCH.DOLLY_PAN;camera.up.set(0,1,0);camera.position.set(c.target.x+dim*.55,c.target.y+dim*.70,c.target.z+dim*.55);camera.lookAt(c.target);c.update();}new GLTFLoader().load('./mapa-real.glb',g=>{scene.add(g.scene);const box=new THREE.Box3().setFromObject(g.scene),sz=box.getSize(new THREE.Vector3());dim=Math.max(sz.x,sz.z,100);box.getCenter(center);aerialView();status.textContent='TopoExport • '+Math.round(sz.x)+' × '+Math.round(sz.z)+' m';},undefined,e=>{status.textContent='Falha ao carregar mapa';console.error(e);});document.getElementById('top').onclick=()=>aerialView(false);document.getElementById('angle').onclick=perspective;document.getElementById('reset').onclick=()=>aerialView(true);function zoom(k){camera.position.sub(c.target).multiplyScalar(k).add(c.target);c.update();}document.getElementById('zoomIn').onclick=()=>zoom(1/1.4);document.getElementById('zoomOut').onclick=()=>zoom(1.4);document.getElementById('left').onclick=()=>{if(aerial){camera.up.applyAxisAngle(new THREE.Vector3(0,1,0),Math.PI/2);camera.lookAt(c.target)}else c.rotateLeft(Math.PI/10);c.update()};document.getElementById('right').onclick=()=>{if(aerial){camera.up.applyAxisAngle(new THREE.Vector3(0,1,0),-Math.PI/2);camera.lookAt(c.target)}else c.rotateLeft(-Math.PI/10);c.update()};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function loop(){requestAnimationFrame(loop);c.update();renderer.render(scene,camera)}loop();</script></body></html>
