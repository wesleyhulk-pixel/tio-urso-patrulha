<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Mapa real — inspeção TopoExport</title><style>html,body{margin:0;width:100%;height:100%;background:#0b1520;color:white;font:14px system-ui}#view{position:absolute;inset:0}#tools{position:absolute;z-index:2;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}button,span{pointer-events:auto;background:#16344edd;color:white;border:1px solid #6fadc6;padding:8px;border-radius:8px;font-size:12px}#help{position:absolute;bottom:7px;left:7px;right:7px;background:#14283be9;padding:8px;border-radius:8px;font-size:12px}#status{background:#162f43ee}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script></head><body><div id="view"></div><div id="tools"><button id="top">⬇ Vista de cima</button><button id="angle">◩ Perspectiva</button><button id="reset">⤢ Centralizar</button><span id="status">Carregando mapa...</span></div><div id="help">Mapa 3D ORIGINAL do TopoExport, sem edifícios reposicionados por IA. Arraste para girar • pinça para zoom. Confirme visualmente onde fica a Quadra da Matriz antes de integrarmos a área ao jogo.</div><script type="module">import * as THREE from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';const host=document.getElementById('view'),status=document.getElementById('status');const scene=new THREE.Scene();scene.background=new THREE.Color(0xb8d8e6);const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,10000);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x9ca9a9,2.2));const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(200,500,300);scene.add(sun);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;let dim=600,center=new THREE.Vector3();function viewTop(){camera.position.set(center.x,center.y+dim*1.55,center.z+.01);camera.up.set(0,0,-1);camera.lookAt(center);controls.target.copy(center);controls.update();}function viewAngle(){camera.up.set(0,1,0);camera.position.set(center.x+dim*.75,center.y+dim*.75,center.z+dim*.75);camera.lookAt(center);controls.target.copy(center);controls.update();}new GLTFLoader().load('./mapa-real.glb',g=>{scene.add(g.scene);const box=new THREE.Box3().setFromObject(g.scene),sz=box.getSize(new THREE.Vector3());dim=Math.max(sz.x,sz.y,sz.z,100);box.getCenter(center);viewTop();status.textContent='Mapa carregado • '+Math.round(sz.x)+' × '+Math.round(sz.z)+' m';},undefined,e=>{status.textContent='Erro ao abrir o GLB';console.error(e);});document.getElementById('top').onclick=viewTop;document.getElementById('angle').onclick=viewAngle;document.getElementById('reset').onclick=viewTop;addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function tick(){requestAnimationFrame(tick);controls.update();renderer.render(scene,camera)}tick();</script></body></html>
