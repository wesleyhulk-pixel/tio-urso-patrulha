<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Quadra real — vista fixa v1.2</title><style>
*{box-sizing:border-box}body{margin:0;color:white;background:#132333;font:14px system-ui}#map{position:fixed;inset:0;touch-action:none}#panel{position:fixed;top:10px;left:10px;z-index:3;background:#102a3aee;border-radius:12px;padding:12px;max-width:min(325px,76vw);max-height:85vh;overflow:auto}button{background:#264e63;color:white;border:1px solid #759eb0;border-radius:8px;padding:9px;margin:3px}#toggle{position:fixed;right:10px;top:10px;z-index:4}#panel.hide{display:none}#status{font-size:12px;color:#a9dfed}small{color:#bed5df}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><div id="map"></div><button id="toggle">☰ Painel</button><section id="panel"><b>Quadra Matriz — vista fixa v1.2</b><p id="status">Carregando GLB...</p><button id="aerial">🗺️ Vista aérea fixa</button><button id="oblique">🏙️ Perspectiva</button><button id="near">＋ Zoom</button><button id="far">－ Zoom</button><button id="a11">📍 Central A11</button><button id="all">Todos pontos</button><p><small>Na vista aérea: arraste para mover o mapa; pinça para zoom. A direção não gira. Na perspectiva: arraste para girar.</small></p><small>🟠 A11 Recepção GM • 🔴 P1–P5 Prédios • 🔵 E5 Estacionamento • 🟢 Centro<br>Geometria original do TopoExport, sem reposicionar prédios.</small></section>
<script type="module">
import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const points={A11:[297.7397783351056,-719.9681192752971],P1:[237.47204153421796,-778.2731202291623],P2:[288.264983717006,-731.6064083586563],P3:[358.29951461255405,-657.0546675906598],P4:[247.4867002218611,-694.6296011945358],P5:[203.60213230481918,-732.9984823514644],E5:[278.1171581603068,-721.811024840226],Centro:[296.3829657486257,-687.37080714687]};
const scene=new THREE.Scene();scene.background=new THREE.Color(0xb7c7c9);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.querySelector('#map').append(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x526273,2.4));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(150,700,200);scene.add(sun);
const aspect=()=>innerWidth/innerHeight;const aCam=new THREE.OrthographicCamera(-100*aspect(),100*aspect(),100,-100,0.1,3000),pCam=new THREE.PerspectiveCamera(55,aspect(),0.1,5000);aCam.up.set(0,0,-1);const ctrls=new OrbitControls(pCam,renderer.domElement);ctrls.enableDamping=true;ctrls.minDistance=15;ctrls.maxDistance=1000;ctrls.maxPolarAngle=Math.PI/2-.04;let aerial=true,camera=aCam,ground=790,span=250;let center=new THREE.Vector3(points.Centro[0],ground,points.Centro[1]);let drag=null,distStart=null;
function focus(x,z,width=225){center.set(x,ground,z);span=width;placeAerial(); if(!aerial){ctrls.target.copy(center);pCam.position.set(x+width*.68,ground+width*.68,z+width*.52);ctrls.update();}}
function placeAerial(){aCam.left=-span*aspect()/2;aCam.right=span*aspect()/2;aCam.top=span/2;aCam.bottom=-span/2;aCam.updateProjectionMatrix();aCam.position.set(center.x,ground+1500,center.z);aCam.lookAt(center);}
function mode(isAerial){aerial=isAerial;camera=aerial?aCam:pCam;ctrls.enabled=!aerial;if(aerial){placeAerial();}else{ctrls.target.copy(center);pCam.position.set(center.x+span*.7,ground+span*.9,center.z+span*.7);pCam.lookAt(center);ctrls.update();}}
function label(txt,color){const c=document.createElement('canvas');c.width=256;c.height=116;const k=c.getContext('2d');k.fillStyle='#132d41ee';k.fillRect(0,0,256,116);k.font='bold 65px sans-serif';k.textAlign='center';k.fillStyle='white';k.fillText(txt,128,80);let o=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));o.scale.set(15,7,1);return o}
const status=document.querySelector('#status');new GLTFLoader().load('./mapa-topoexport.glb',g=>{const model=g.scene;model.rotation.x=-Math.PI/2;scene.add(model);model.updateMatrixWorld(true);const bbox=new THREE.Box3().setFromObject(model);ground=bbox.min.y;const ray=new THREE.Raycaster();for(const [name,[x,z]] of Object.entries(points)){ray.set(new THREE.Vector3(x,bbox.max.y+100,z),new THREE.Vector3(0,-1,0));const hit=ray.intersectObject(model,true).find(h=>h.point.y< bbox.max.y+90);const y=hit?hit.point.y:ground+6;let color=name==='A11'?0xff931c:name==='E5'?0x2387ef:name==='Centro'?0x22bc77:0xef4d4d;const mark=new THREE.Mesh(new THREE.SphereGeometry(2,12,8),new THREE.MeshBasicMaterial({color,depthTest:false}));mark.position.set(x,y+4,z);scene.add(mark);const text=label(name,color);text.position.set(x,y+11,z);scene.add(text)}focus(...points.Centro,240);mode(true);status.textContent='Mapa carregado. Vista aérea fixa ativa.';},undefined,e=>status.textContent='Erro: '+e.message);
document.querySelector('#aerial').onclick=()=>mode(true);document.querySelector('#oblique').onclick=()=>mode(false);document.querySelector('#a11').onclick=()=>focus(...points.A11,100);document.querySelector('#all').onclick=()=>focus(...points.Centro,250);document.querySelector('#near').onclick=()=>{if(aerial){span=Math.max(20,span*.75);placeAerial()}else{pCam.position.copy(ctrls.target).add(pCam.position.clone().sub(ctrls.target).multiplyScalar(.75));ctrls.update()}};document.querySelector('#far').onclick=()=>{if(aerial){span=Math.min(1500,span*1.3);placeAerial()}else{pCam.position.copy(ctrls.target).add(pCam.position.clone().sub(ctrls.target).multiplyScalar(1.3));ctrls.update()}};document.querySelector('#toggle').onclick=()=>document.querySelector('#panel').classList.toggle('hide');
renderer.domElement.addEventListener('pointerdown',e=>{if(!aerial)return;drag=[e.clientX,e.clientY];renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!aerial||!drag)return;const dx=e.clientX-drag[0],dy=e.clientY-drag[1];center.x-=dx*span/innerHeight;center.z-=dy*span/innerHeight;drag=[e.clientX,e.clientY];placeAerial()});renderer.domElement.addEventListener('pointerup',()=>drag=null);renderer.domElement.addEventListener('wheel',e=>{if(!aerial)return;e.preventDefault();span=Math.max(20,Math.min(1500,span*(e.deltaY>0?1.12:.88)));placeAerial()},{passive:false});
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);pCam.aspect=aspect();pCam.updateProjectionMatrix();placeAerial()});function tick(){requestAnimationFrame(tick);if(!aerial)ctrls.update();renderer.render(scene,camera)}tick();
</script></body></html>
